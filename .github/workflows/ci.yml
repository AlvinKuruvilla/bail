name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The tests assert type narrowing and variance, so both checkers must see
      # them: a regression there fails type-checking, not pytest.
      - run: uv run mypy src tests examples
      - run: uv run pyright src tests examples
      - run: uv run pytest
      - run: for example in examples/*.py; do uv run python "$example"; done
      - run: uv run pip-audit
