[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bail"
version = "0.1.0"
description = "A Result type for Python with exhaustive match and early return"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alvin Kuruvilla", email = "alvineasokuruvilla@gmail.com" },
]
dependencies = []

[project.scripts]
bail-lint = "bail.lint:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "syrupy>=4",
    "ruff>=0.9",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4",
    "pyright>=1.1.414",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bail"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "PTH",      # flake8-use-pathlib (prefer pathlib.Path)
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["bail"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
