  <path d="M66 42 L81 33 L88 49" stroke="#f07178" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="52" cy="84" r="9" fill="#1f2430" stroke="#ffd580" stroke-width="6"/>
